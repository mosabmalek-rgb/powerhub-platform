name: One-off normalize complaints query input
on:
  push:
    branches:
      - reconcile/admin-supabase-on-current-20260913
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix(ci): normalize complaints query input') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reconcile/admin-supabase-on-current-20260913
          fetch-depth: 0
      - name: Patch exact call site
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/AdminAdvancedWorkspace.tsx')
          text = path.read_text()
          old = 'const complaints = trpc.admin.listComplaints.useQuery();'
          new = 'const complaints = trpc.admin.listComplaints.useQuery(undefined);'
          if old not in text:
              raise SystemExit('expected call site not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/AdminAdvancedWorkspace.tsx
          git diff --cached --check
          git commit -m 'fix(ci): normalize complaints query input'
          git push origin HEAD:reconcile/admin-supabase-on-current-20260913
