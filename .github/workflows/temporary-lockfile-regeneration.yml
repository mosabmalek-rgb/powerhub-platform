name: Temporary PowerHub Lockfile Regeneration

on:
  push:
    branches: [feat/auth-local-first-single-pr]

permissions:
  contents: write

concurrency:
  group: powerhub-lockfile-regeneration-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  regenerate:
    name: Regenerate and validate pnpm lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Regenerate lockfile from exact workspace configuration
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Capture generated dependency graph diagnostics
        if: always()
        run: |
          pnpm why glob --recursive > pnpm-why-glob.txt 2>&1 || true
          grep -n -E 'glob@|archiver-utils@|minimatch@|brace-expansion@' pnpm-lock.yaml > pnpm-lock-matcher-entries.txt || true
      - name: Upload generated lockfile diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-lockfile-diagnostics
          path: |
            pnpm-lock.yaml
            pnpm-why-glob.txt
            pnpm-lock-matcher-entries.txt
          if-no-files-found: error

      - name: Verify frozen lockfile consistency
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify dependency security contract
        run: node scripts/check-dependency-security.mjs

      - name: Verify matcher and ExcelJS compatibility
        run: node scripts/check-minimatch-compatibility.mjs

      - name: Audit all lockfile dependency groups
        run: |
          set +e
          pnpm audit --json > pnpm-audit-regenerated.json 2> pnpm-audit-regenerated-errors.log
          audit_status=$?
          set -e
          node scripts/summarize-pnpm-audit.mjs pnpm-audit-regenerated.json "$audit_status" | tee pnpm-audit-regenerated-summary.md

      - name: Require zero registry advisories in all dependency groups
        run: pnpm audit --audit-level low

      - name: Upload generated lockfile and audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: powerhub-regenerated-lockfile
          path: |
            pnpm-lock.yaml
            pnpm-audit-regenerated.json
            pnpm-audit-regenerated-errors.log
            pnpm-audit-regenerated-summary.md
          if-no-files-found: error

      - name: Commit verified lockfile and remove temporary generator
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git rm .github/workflows/temporary-lockfile-regeneration.yml
          git commit -m "chore(deps): commit clean audited pnpm lockfile"
          git push origin HEAD:$GITHUB_REF_NAME
