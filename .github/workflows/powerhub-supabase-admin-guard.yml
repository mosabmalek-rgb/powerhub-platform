name: PowerHub Supabase Admin Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: powerhub-supabase-admin-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-guards:
    name: Supabase runtime migration guards
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap pnpm in runner temp
        shell: cmd
        run: npm.cmd install --prefix "%RUNNER_TEMP%\pnpm" --no-save pnpm@10.34.5

      - name: Install dependencies
        shell: cmd
        run: "%RUNNER_TEMP%\pnpm\node_modules\.bin\pnpm.cmd --version && %RUNNER_TEMP%\pnpm\node_modules\.bin\pnpm.cmd install --frozen-lockfile"

      - name: Run Supabase migration guard tests (non-blocking)
        continue-on-error: true
        shell: cmd
        run: >-
          "%RUNNER_TEMP%\pnpm\node_modules\.bin\pnpm.cmd" exec vitest run
          server/admin.legacy-write-guards.test.ts
          server/admin.tenant-branch-settings-supabase.test.ts
          server/powerhub-mobile-approve-runtime.test.ts
          server/supabase-runtime-boundary.test.ts
          server/admin.dashboard-sync-contract.test.ts
