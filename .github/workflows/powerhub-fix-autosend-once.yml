name: PowerHub fix auto-send retirement once
on:
  push:
    branches: [refactor/admin-supabase-migration]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-supabase-migration
      - name: Remove retired auto-send result contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('client/src/pages/MessagingSettingsPage.tsx')
          text = path.read_text()
          old = 'const autoSendMutation = trpc.powerhub.messaging.configureInvoiceAutoSend.useMutation({ onSuccess: async (result) => { await refresh(); toast.success(result.enabled ? "تم تفعيل جدولة إرسال الفواتير." : "تم إيقاف جدولة إرسال الفواتير."); }, onError: (e) => toast.error(e.message) });'
          new = 'const autoSendMutation = trpc.powerhub.messaging.configureInvoiceAutoSend.useMutation({ onSuccess: async () => { await refresh(); toast.success("تمت معالجة إعداد الإرسال التلقائي."); }, onError: (e) => toast.error(e.message) });'
          if old not in text:
              raise SystemExit('Expected auto-send callback was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/MessagingSettingsPage.tsx
          git rm .github/workflows/powerhub-fix-autosend-once.yml
          git commit -m 'fix(migration): retire auto-send result contract'
          git push origin HEAD:refactor/admin-supabase-migration
