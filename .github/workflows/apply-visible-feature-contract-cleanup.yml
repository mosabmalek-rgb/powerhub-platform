name: Apply Visible Feature Contract Cleanup

on:
  push:
    branches:
      - fix/visible-feature-contracts-20260918

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply visible feature contract cleanup') && !contains(github.event.head_commit.message, 'chore: remove one-shot visible feature patcher') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact source patch
        run: node scripts/apply-visible-feature-contract-cleanup.mjs

      - name: Validate patch
        run: |
          git diff --check
          test "$(grep -o 'تفعيل الجدولة' client/src/pages/MessagingSettingsPage.tsx | wc -l)" -eq 0
          test "$(grep -o 'اختبار الاتصال' client/src/pages/MessagingSettingsPage.tsx | wc -l)" -eq 0
          test "$(grep -o 'إعادة إرسال' client/src/pages/MessagingSettingsPage.tsx | wc -l)" -ge 0

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src/pages/MessagingSettingsPage.tsx client/src/pages/MessagingSettingsPage.ui.test.tsx
          git rm .github/workflows/apply-visible-feature-contract-cleanup.yml scripts/apply-visible-feature-contract-cleanup.mjs
          git commit -m "chore: apply visible feature contract cleanup"
          git push
