name: PowerHub P7 Real HTTP Load

on:
  push:
    branches:
      - scale/p7-real-http-load
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: powerhub-p7-load
  cancel-in-progress: true

jobs:
  load:
    name: Real HTTP 50/100/250/500
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POWERHUB_PRODUCTION_URL: https://powerhub-platform.vercel.app
      LOADTEST_TIMEOUT_MS: 15000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Runner diagnostics
        run: |
          node --version
          npm --version
          getent hosts powerhub-platform.vercel.app || true
          curl -I --max-time 15 --retry 2 --retry-delay 1 "$POWERHUB_PRODUCTION_URL/api/ready"

      - name: Run real HTTP load
        run: node scripts/p7-real-http-load.mjs

      - name: Validate result file
        if: always()
        run: |
          test -f p7-load-results.json || exit 1
          node -e "const r=require('./p7-load-results.json'); console.log(JSON.stringify({pass:r.pass,maxErrorRatePct:r.maxErrorRatePct,stages:r.stages.map(s=>({concurrency:s.concurrency,errorRatePct:s.errorRatePct,p95Ms:s.p95Ms,p99Ms:s.p99Ms,throughputRps:s.throughputRps}))},null,2))"

      - name: Upload load results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-load-results
          path: p7-load-results.json
          if-no-files-found: warn
