name: One-time pnpm lockfile artifact sync

on:
  push:
    branches:
      - feat/auth-local-first-single-pr

permissions:
  contents: read

jobs:
  sync-lockfile:
    if: github.ref == 'refs/heads/feat/auth-local-first-single-pr' && contains(github.event.head_commit.message, '[pnpm-lockfile-sync]')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/auth-local-first-single-pr

      - name: Download the verified Security artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/13166132477/zip" \
            -o "${RUNNER_TEMP}/patched-pnpm-lockfile.zip"
          unzip -p "${RUNNER_TEMP}/patched-pnpm-lockfile.zip" pnpm-lock.yaml > pnpm-lock.yaml
          echo "fe6bd09475c2d911f9434b588d97f52179e664a100365c49e41dfe5086cf45c8  pnpm-lock.yaml" | sha256sum --check

      - name: Verify workspace and lockfile overrides match
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";

          const block = (source, file) => {
            const lines = source.split(/\r?\n/);
            const start = lines.indexOf("overrides:");
            assert.notEqual(start, -1, `Missing overrides block in ${file}`);
            const entries = [];
            for (const line of lines.slice(start + 1)) {
              if (line.length > 0 && !/^[ \t]/.test(line)) break;
              if (line.trim().length > 0) entries.push(line);
            }
            return entries.join("\n").trimEnd();
          };

          const workspace = fs.readFileSync("pnpm-workspace.yaml", "utf8");
          const lock = fs.readFileSync("pnpm-lock.yaml", "utf8");
          assert.equal(block(lock, "pnpm-lock.yaml"), block(workspace, "pnpm-workspace.yaml"));
          console.log("Workspace and lockfile override blocks match exactly.");
          NODE

      - name: Commit only pnpm-lock.yaml
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "The lockfile already matches the validated artifact."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          test "$(git diff --cached --name-only)" = "pnpm-lock.yaml"
          git commit -m "chore(deps): sync pnpm lockfile with security overrides"
          git push origin "HEAD:${GITHUB_REF_NAME}"
