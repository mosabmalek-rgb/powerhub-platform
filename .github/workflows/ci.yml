name: PowerHub CI

on:
  push:
    branches: [main, p4-production-excellence, p6-scale-operations]
  pull_request:
    branches: [main, p5-6-commercial-launch, refactor/admin-supabase-migration]

permissions:
  contents: read

concurrency:
  group: powerhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, tests, and production build
    runs-on: self-hosted
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key
    defaults:
      run:
        working-directory: _ci/${{ github.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
          path: _ci/${{ github.run_id }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: _ci/${{ github.run_id }}/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase runtime boundary
        run: node scripts/check-supabase-runtime-boundary.mjs

      - name: TypeScript check
        run: pnpm check > tsc-errors.log 2>&1

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: _ci/${{ github.run_id }}/tsc-errors.log
          if-no-files-found: warn

      - name: Run tests
        shell: cmd
        run: |
          pnpm test > test-errors.log 2>&1
          if %ERRORLEVEL% NEQ 0 exit /b %ERRORLEVEL%

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: _ci/${{ github.run_id }}/test-errors.log
          if-no-files-found: warn

      - name: Build production artifacts
        run: pnpm build
