name: PowerHub CI

on:
  workflow_dispatch:
  push:
    branches: [main, p4-production-excellence, p6-scale-operations, feat/auth-local-first-single-pr]
  pull_request:
    branches: [main, p5-6-commercial-launch, refactor/admin-supabase-migration]

permissions:
  contents: read

concurrency:
  group: powerhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify minimatch 11 compatibility with legacy glob consumers
        run: node scripts/check-minimatch-compatibility.mjs

      - name: Validate versioned Supabase migration release tooling
        run: |
          node --check scripts/check-supabase-migration-files.mjs
          node --check scripts/supabase-migration-target.mjs
          node --check scripts/supabase-migration-file.mjs
          node --check scripts/supabase-migration-target.test.mjs
          node --check scripts/release-supabase-migration.mjs
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          fi
          node scripts/check-supabase-migration-files.mjs
          node scripts/check-supabase-default-privileges.mjs
          pnpm exec vitest run --maxWorkers=1 server/supabase-migration-target.test.ts

      - name: Audit PR359 migration evidence (source only; not release acceptance)
        run: |
          node --check scripts/pr359-migration-evidence.mjs
          node --test scripts/pr359-migration-evidence.test.mjs
          node --test scripts/pr359-production-three-catalog-evidence.test.mjs
          node --test scripts/pr359-full-ledger-crosswalk.test.mjs
          node scripts/pr359-full-ledger-crosswalk.mjs --out pr359-full-ledger-crosswalk.json
          node --check scripts/pr359-financial-shadow-preflight.mjs
          node --test scripts/pr359-financial-shadow-preflight.test.mjs
          node scripts/pr359-financial-shadow-preflight.mjs --out pr359-financial-shadow-preflight.json
          node scripts/pr359-migration-evidence.mjs --out pr359-migration-evidence-resolved.json
          node --test scripts/pr359-historical-review-matrix.test.mjs
          node scripts/pr359-historical-review-matrix.mjs --out pr359-historical-review-matrix.json
          node --check scripts/pr359-p0-live-catalog-review.mjs
          node --test scripts/pr359-p0-live-catalog-review.test.mjs
          node scripts/pr359-p0-live-catalog-review.mjs --out pr359-p0-live-catalog-review.json
          node --check scripts/pr359-finance-live-cash-proof.mjs
          node --test scripts/pr359-finance-live-cash-proof.test.mjs
          node scripts/pr359-finance-live-cash-proof.mjs --out pr359-finance-live-cash-proof.json

      - name: Upload historical migration source-hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr359-migration-source-evidence
          path: |
            pr359-migration-evidence-resolved.json
            pr359-full-ledger-crosswalk.json
            pr359-financial-shadow-preflight.json
            pr359-historical-review-matrix.json
            pr359-p0-live-catalog-review.json
            pr359-finance-live-cash-proof.json
          if-no-files-found: error

      - name: CB-A writer inventory (source candidates only)
        run: |
          node --check scripts/pr359-canonical/cb-a-writer-inventory.mjs
          node scripts/pr359-canonical/cb-a-writer-inventory.mjs --out pr359-cb-a-writer-inventory.json

      - name: Upload CB-A writer candidate inventory
        uses: actions/upload-artifact@v4
        with:
          name: pr359-cb-a-writer-inventory
          path: pr359-cb-a-writer-inventory.json
          if-no-files-found: error

      - name: Supabase runtime boundary
        run: node scripts/check-supabase-runtime-boundary.mjs

      - name: TypeScript check
        run: pnpm check > tsc-errors.log 2>&1

      - name: Print TypeScript diagnostics
        if: always()
        run: if [ -f tsc-errors.log ]; then cat tsc-errors.log; fi

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-errors.log
          if-no-files-found: warn

      - name: D36 authenticated financial isolation harness (mock-transport regression)
        run: node --test scripts/d36-financial-tenant-isolation-http.test.mjs

      - name: E44 authenticated non-owner financial role matrix (mock-transport regression)
        run: node --test scripts/e44-financial-role-matrix-http.test.mjs

      - name: Run tests
        run: pnpm test > test-errors.log 2>&1

      - name: Print test diagnostics
        if: always()
        run: if [ -f test-errors.log ]; then tail -n 250 test-errors.log; fi

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-errors.log
          if-no-files-found: warn

      - name: Build production artifacts
        run: pnpm build

  native-indexeddb-repair:
    name: Native Chromium IndexedDB repair and Outbox isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@10.34.5
      - run: pnpm install --frozen-lockfile
      - name: Run isolated native browser recovery fixture
        run: node scripts/pr359-canonical/run-browser-repair.mjs
