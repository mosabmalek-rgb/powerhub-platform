name: PowerHub CI

on:
  push:
    branches: [main, p4-production-excellence, p6-scale-operations]
  pull_request:
    branches: [main, p5-6-commercial-launch, refactor/admin-supabase-migration]

permissions:
  contents: read

concurrency:
  group: powerhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, tests, and production build
    # Keep untrusted pull-request code off the local runner.
    # Pushes to trusted branches run on the self-hosted PowerHub runner.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase runtime boundary
        run: node scripts/check-supabase-runtime-boundary.mjs

      - name: TypeScript check
        shell: pwsh
        run: |
          pnpm check 2>&1 | Tee-Object -FilePath tsc-errors.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload TypeScript diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-errors.log
          if-no-files-found: warn

      - name: Run tests (non-blocking)
        continue-on-error: true
        run: pnpm test

      - name: Build production artifacts
        run: pnpm build
