name: PowerHub CI

on:
  push:
    branches: [main, p4-production-excellence, p6-scale-operations]
  pull_request:
    branches: [main, p5-6-commercial-launch, refactor/admin-supabase-migration]

permissions:
  contents: read

concurrency:
  group: powerhub-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=12288
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Bootstrap pnpm
        run: npm install --global pnpm@10.34.5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Supabase runtime boundary
        run: node scripts/check-supabase-runtime-boundary.mjs

      - name: TypeScript check
        run: pnpm check > tsc-errors.log 2>&1

      - name: Upload TypeScript diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typescript-diagnostics
          path: tsc-errors.log
          if-no-files-found: warn

      - name: Run tests
        run: pnpm test > test-errors.log 2>&1

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: test-errors.log
          if-no-files-found: warn

      - name: Build production artifacts
        run: pnpm build
