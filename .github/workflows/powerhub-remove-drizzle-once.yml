name: PowerHub remove legacy Drizzle/MySQL once

on:
  push:
    branches: [refactor/admin-supabase-migration]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: powerhub-remove-drizzle-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-supabase-migration
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.4.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify no live legacy callers outside removal set
        shell: bash
        run: |
          set -euo pipefail
          patterns='drizzle-orm|mysql2|from ["'"'"']\.\.?/.*drizzle|from ["'"'"']\.\.?/db|require\([^)]*drizzle|require\([^)]*mysql|DATABASE_URL|getDb\('
          matches=$(rg -n -S "$patterns" server scripts --glob '!server/db.ts' --glob '!server/admin.integration.test.ts' --glob '!server/demo-admin-visibility.integration.test.ts' --glob '!server/tenant-isolation.integration.test.ts' --glob '!server/supabase-invitation.integration.test.ts' --glob '!scripts/seed-demo-operational-data.mjs' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi

      - name: Remove legacy files and dependencies
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            server/db.ts \
            server/admin.integration.test.ts \
            server/demo-admin-visibility.integration.test.ts \
            server/tenant-isolation.integration.test.ts \
            server/supabase-invitation.integration.test.ts \
            scripts/seed-demo-operational-data.mjs \
            drizzle.config.ts \
            drizzle/schema.ts \
            drizzle/relations.ts
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          for (const name of ['drizzle-orm', 'mysql2']) delete pkg.dependencies?.[name];
          for (const name of ['drizzle-kit']) delete pkg.devDependencies?.[name];
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only

      - name: Verify legacy boundary is empty
        shell: bash
        run: |
          set -euo pipefail
          remaining=$(rg -n -S 'drizzle-orm|mysql2|DATABASE_URL|getDb\(|from ["'"'"']\.\.?/db' server scripts package.json --glob '!server/db.ts' || true)
          if [ -n "$remaining" ]; then
            echo "$remaining"
            exit 1
          fi
          if [ -f server/db.ts ] || [ -f drizzle.config.ts ] || [ -f drizzle/schema.ts ] || [ -f drizzle/relations.ts ]; then
            echo 'Legacy Drizzle/MySQL files still exist.'
            exit 1
          fi

      - name: TypeScript check
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build

      - name: Commit cleanup and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml server scripts drizzle.config.ts drizzle/schema.ts drizzle/relations.ts .github/workflows/powerhub-remove-drizzle-once.yml
          git commit -m 'refactor(migration): remove legacy drizzle mysql tooling'
          git push origin HEAD:refactor/admin-supabase-migration
