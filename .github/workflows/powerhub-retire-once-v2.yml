name: PowerHub retire legacy once v2
# One-shot retirement trigger for the current Supabase migration head.
on:
  push:
    branches: [refactor/admin-supabase-migration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: powerhub-retire-once-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  retire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      VITE_SUPABASE_URL: https://powerhub-ci.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-public-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/admin-supabase-migration
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: AST-safe PowerHub retirement
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const file = 'server/powerhub.ts';
          let source = fs.readFileSync(file, 'utf8');
          const dead = new Set(['dbOrThrow','insertId','getSiteTenant','issueInvoiceForApprovedReading','approveAndIssueMobileReading','ownerLimitOverride','ownerAllowedSubaccountRoles','ownerSubaccountLimit','activeSubaccountCount','ownerSubscriberQuota','recordSubscriberQuotaAlert','tenantBranchPolicy','resolveRole','resolveAccess','enforcePlatformRolePolicy','requireRole','requireAllBranchRole','writeAudit','assertFinancialPeriodOpen','queueInvoiceNotificationsForSelection','dispatchInvoiceNotifications']);
          const disabled = new Set(['retry','retryFailedInvoiceNotification','retryFailedInvoiceNotifications','retryPaymentReceipt','sendDeferredInvoices','sendBulkInvoiceSms','sendPaymentReminder','sendPaymentReceipt']);
          const ast = ts.createSourceFile(file, source, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const edits=[];
          function firstArrow(node){let found=null;function walk(n){if(found)return;if(ts.isArrowFunction(n)){found=n;return;}ts.forEachChild(n,walk)}ts.forEachChild(node,walk);return found;}
          function walk(node){
            if(ts.isFunctionDeclaration(node)&&node.name&&dead.has(node.name.text))edits.push({start:node.getFullStart(),end:node.end,text:''});
            if(ts.isPropertyAssignment(node)&&ts.isIdentifier(node.name)&&disabled.has(node.name.text)){const a=firstArrow(node.initializer);if(a&&ts.isBlock(a.body))edits.push({start:a.body.getStart(ast),end:a.body.end,text:'{ throw new TRPCError({ code: "PRECONDITION_FAILED", message: "هذا المسار الموروث متوقف مؤقتاً إلى أن تكتمل خدمة Supabase/Vercel المستقلة." }); }'});}
            if(ts.isImportDeclaration(node)&&ts.isStringLiteral(node.moduleSpecifier)){const m=node.moduleSpecifier.text;if(m==='drizzle-orm'||m==='../drizzle/schema'||m==='./db')edits.push({start:node.getFullStart(),end:node.end,text:''});}
            ts.forEachChild(node,walk);
          }
          walk(ast);
          edits.sort((a,b)=>b.start-a.start);
          for(const e of edits)source=source.slice(0,e.start)+e.text+source.slice(e.end);
          if(!edits.length)throw new Error('No AST edits found; aborting without commit.');
          fs.writeFileSync(file,source);
          NODE
      - name: Align client contracts with retired legacy mutations
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const edits = [
            {
              file: 'client/src/pages/MessagingSettingsPage.tsx',
              from: 'const autoSendMutation = trpc.powerhub.messaging.configureInvoiceAutoSend.useMutation({ onSuccess: async (result) => { await refresh(); toast.success(result.enabled ? "تم تفعيل جدولة إرسال الفواتير." : "تم إيقاف جدولة إرسال الفواتير."); }, onError: (e) => toast.error(e.message) });',
              to: 'const autoSendMutation = trpc.powerhub.messaging.configureInvoiceAutoSend.useMutation({ onSuccess: async () => { await refresh(); toast.success("تمت معالجة إعداد الإرسال التلقائي."); }, onError: (e) => toast.error(e.message) });',
            },
            {
              file: 'client/src/pages/MessagingSettingsPage.tsx',
              from: 'const retryReceipt = trpc.powerhub.notifications.retryPaymentReceipt.useMutation({ onSuccess: async (result) => { await refresh(); toast.success(result.status === "submitted" ? "أعيد إرسال الإيصال إلى المزود." : "تمت معالجة طلب إعادة الإرسال."); }, onError: (e) => toast.error(e.message) });',
              to: 'const retryReceipt = trpc.powerhub.notifications.retryPaymentReceipt.useMutation({ onSuccess: async () => { await refresh(); toast.success("تمت معالجة طلب إعادة الإرسال."); }, onError: (e) => toast.error(e.message) });',
            },
            {
              file: 'client/src/pages/MeterReadingsPage.tsx',
              from: 'const sendBulkInvoiceSms = trpc.powerhub.notifications.sendBulkInvoiceSms.useMutation({ onSuccess: async (result) => { await utils.powerhub.notifications.list.invalidate(); toast.success(`تمت معالجة ${result.processed} فاتورة: ${result.successful} ناجحة و${result.failed} فاشلة.`); }, onError: (error) => toast.error(error.message) });',
              to: 'const sendBulkInvoiceSms = trpc.powerhub.notifications.sendBulkInvoiceSms.useMutation({ onSuccess: async () => { await utils.powerhub.notifications.list.invalidate(); toast.success("تمت معالجة طلب إرسال الرسائل."); }, onError: (error) => toast.error(error.message) });',
            },
          ];
          for (const { file, from, to } of edits) {
            const source = fs.readFileSync(file, 'utf8');
            if (!source.includes(from)) throw new Error(`Expected client contract was not found in ${file}`);
            fs.writeFileSync(file, source.replace(from, to));
          }
          NODE
      - run: pnpm check
      - name: Commit and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/powerhub-retire-legacy-once.mjs scripts/powerhub-retire-legacy-ast.mjs .github/workflows/powerhub-retire-once.yml .github/workflows/powerhub-retire-once-v2.yml README.ci-marker.md
          git add server/powerhub.ts client/src/pages/MessagingSettingsPage.tsx client/src/pages/MeterReadingsPage.tsx scripts .github/workflows/powerhub-retire-once.yml .github/workflows/powerhub-retire-once-v2.yml README.ci-marker.md
          git commit -m "refactor(powerhub): retire legacy mysql runtime paths"
          git push origin HEAD:refactor/admin-supabase-migration
