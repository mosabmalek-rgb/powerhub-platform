name: Refresh PR 359 dependency lockfile

on:
  push:
    branches: [feat/auth-local-first-single-pr]
    paths:
      - .github/workflows/refresh-dependency-lock.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: powerhub-pr359-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate PR state and exact head
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/359")"
          jq -e --arg sha "$EXPECTED_HEAD" '
            .state == "open" and .draft == true and .merged_at == null and
            .base.ref == "main" and .head.ref == "feat/auth-local-first-single-pr" and .head.sha == $sha
          ' <<<"$pr" >/dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.5

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Validate patched transitive versions
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const lock = readFileSync("pnpm-lock.yaml", "utf8");
          const required = [
            "body-parser@1.20.9", "follow-redirects@1.16.2",
            "minimatch@11.0.1", "postcss-selector-parser@6.1.5",
            "qs@6.17.1", "undici@8.12.2"
          ];
          const missing = required.filter((v) => !lock.includes(`  ${v}:`));
          const vulnerable = [
            "body-parser@1.20.3", "follow-redirects@1.16.0",
            "minimatch@3.1.5", "minimatch@5.1.9",
            "postcss-selector-parser@6.0.10", "qs@6.13.0", "undici@8.10.0"
          ].filter((v) => lock.includes(`  ${v}:`));
          if (missing.length || vulnerable.length) {
            throw new Error(JSON.stringify({missing, vulnerable}));
          }
          NODE

      - name: Verify frozen lockfile install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Commit refreshed lockfile with race protection
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/feat/auth-local-first-single-pr" --jq '.object.sha')"
          [[ "$actual" == "$EXPECTED_HEAD" ]] || {
            echo "::error::Branch advanced; refusing to write a stale lockfile."
            exit 1
          }
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/359")"
          jq -e --arg sha "$EXPECTED_HEAD" '.state == "open" and .draft == true and .merged_at == null and .head.sha == $sha' <<<"$pr" >/dev/null
          blob="$(gh api "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml?ref=$EXPECTED_HEAD" --jq '.sha')"
          encoded="$(base64 -w0 pnpm-lock.yaml)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/pnpm-lock.yaml" \
            --field message="fix(deps): refresh pnpm lockfile for patched transitive dependencies" \
            --field content="$encoded" --field sha="$blob" \
            --field branch="feat/auth-local-first-single-pr" --jq '.commit.sha'
