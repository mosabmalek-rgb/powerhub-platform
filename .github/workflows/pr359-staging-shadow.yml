name: PR359 Staging Shadow Restore (isolated, read-only source)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr359-staging-shadow-${{ github.ref }}
  cancel-in-progress: false
jobs:
  real-staging-ledger-restore:
    if: >-
      github.ref == 'refs/heads/feat/auth-local-first-single-pr' &&
      vars.PR359_ENABLE_STAGING_DOCKER_SHADOW == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: pr359-staging-shadow
    env:
      SHADOW_SOURCE_KIND: staging
      SHADOW_CONFIRM_STAGING_TEST_DATA: YES_STAGING_TEST_DATA
      SHADOW_REQUIRE_SESSION_POOLER: 'true'
      SHADOW_SOURCE_DB_URL: ${{ secrets.PR359_STAGING_SHADOW_SOURCE_DB_URL }}
      SHADOW_APPROVED_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate Staging-only source identity and TLS
        run: node scripts/pr359-shadow/guard.mjs
      - uses: supabase/setup-cli@v3
        with:
          version: 3.2.0
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Two independent disposable Staging history restores
        run: |
          bash -n scripts/pr359-shadow/run.sh
          bash scripts/pr359-shadow/run.sh staging-restore
