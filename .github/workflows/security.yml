name: PowerHub Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit critical vulnerabilities
        run: pnpm audit --audit-level=critical

  dependency-remediation:
    name: Remediate critical dependencies
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'p5-4-2-financial-trends' && needs.dependency-audit.result == 'failure' }}
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Apply minimum safe dependency versions
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.devDependencies = pkg.devDependencies || {};
          pkg.devDependencies.vitest = '^3.2.6';
          pkg.pnpm = pkg.pnpm || {};
          pkg.pnpm.overrides = pkg.pnpm.overrides || {};
          pkg.pnpm.overrides['tailwindcss>nanoid'] = '3.3.7';
          pkg.pnpm.overrides['fast-xml-parser'] = '5.3.5';
          pkg.pnpm.overrides['tar'] = '7.5.19';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only

      - name: Verify frozen lockfile and critical audit
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=critical

      - name: Commit and push remediation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "fix: remediate critical dependency vulnerabilities"
          git push origin HEAD:${{ github.head_ref }}

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && vars.GITHUB_ADVANCED_SECURITY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
