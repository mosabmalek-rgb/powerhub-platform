name: P7 Preview Browser Smoke and Performance

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  statuses: read

concurrency:
  group: p7-preview-e2e-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  preview-browser-smoke:
    name: Browser smoke and Network Timing comparison
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PLAYWRIGHT_HOME: /tmp/p7-preview-e2e
      PREVIEW_URL: https://powerhub-platform-git-feat-p7-batch-c-d-r-bb5819-mosabmalek-rgb.vercel.app
      BASELINE_URL: https://powerhub-platform-e6gra9hfe-mosabmalek-rgb.vercel.app
      PERFORMANCE_OUTPUT: artifacts/p7-preview-performance.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Wait for Vercel preview on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            states="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/status" --jq '[.statuses[] | select(.context == "Vercel") | .state] | join(",")' 2>/dev/null || true)"
            if printf '%s' "$states" | tr ',' '\n' | grep -qx success; then
              echo "Vercel reported success for $HEAD_SHA"
              exit 0
            fi
            if printf '%s' "$states" | tr ',' '\n' | grep -qx failure; then
              echo "Vercel reported failure for $HEAD_SHA: $states"
              exit 1
            fi
            echo "Waiting for Vercel status for $HEAD_SHA (attempt $attempt/60): $states"
            sleep 10
          done
          echo "Timed out waiting for a successful Vercel deployment on $HEAD_SHA"
          exit 1

      - name: Install isolated Playwright
        run: |
          mkdir -p "$PLAYWRIGHT_HOME"
          npm install --prefix "$PLAYWRIGHT_HOME" --no-save playwright@1.55.0
          "$PLAYWRIGHT_HOME/node_modules/.bin/playwright" install --with-deps chromium

      - name: Run read-only browser smoke and performance probes
        run: node scripts/e2e-preview-smoke.mjs

      - name: Upload browser and performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p7-preview-performance-${{ github.run_id }}
          path: artifacts/p7-preview-performance.json
          if-no-files-found: warn
