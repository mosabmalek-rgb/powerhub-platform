name: Self-hosted Windows Toolchain and PostgreSQL Readiness

on:
  push:
    branches:
      - diagnostics/github-hosted-runner-20261014

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Windows CI prerequisites
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: cmd
        run: |
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo RUNNER_NAME=%RUNNER_NAME%
          echo GITHUB_ACTIONS=%GITHUB_ACTIONS%

      - name: Check Node and package tools
        shell: cmd
        run: |
          where node
          node --version
          where npm
          call npm --version
          where corepack
          corepack --version
          where git
          git --version

      - name: Check PostgreSQL and container tools
        shell: cmd
        run: |
          where psql
          if errorlevel 1 echo PSQL_NOT_INSTALLED
          where createdb
          if errorlevel 1 echo CREATEDB_NOT_INSTALLED
          where docker
          if errorlevel 1 echo DOCKER_NOT_INSTALLED
          where podman
          if errorlevel 1 echo PODMAN_NOT_INSTALLED
