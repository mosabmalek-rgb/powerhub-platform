name: Self-hosted Windows Toolchain and PostgreSQL Readiness

on:
  push:
    branches:
      - diagnostics/github-hosted-runner-20261014

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Windows CI prerequisites
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: cmd
        run: |
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo RUNNER_NAME=%RUNNER_NAME%
          echo GITHUB_ACTIONS=%GITHUB_ACTIONS%
          whoami
          net session >nul 2>&1
          if errorlevel 1 (echo RUNNER_NOT_ELEVATED) else (echo RUNNER_ELEVATED)

      - name: Check Node and package tools
        shell: cmd
        run: |
          where node
          node --version
          where npm
          call npm --version
          where corepack
          corepack --version
          where git
          git --version

      - name: Inspect available PostgreSQL installation paths
        shell: cmd
        run: |
          where psql
          if errorlevel 1 echo PSQL_NOT_INSTALLED
          where createdb
          if errorlevel 1 echo CREATEDB_NOT_INSTALLED
          where pg_ctl
          if errorlevel 1 echo PG_CTL_NOT_INSTALLED
          where initdb
          if errorlevel 1 echo INITDB_NOT_INSTALLED
          where docker
          if errorlevel 1 echo DOCKER_NOT_INSTALLED
          where podman
          if errorlevel 1 echo PODMAN_NOT_INSTALLED
          where choco
          if errorlevel 1 echo CHOCO_NOT_INSTALLED
          where winget
          if errorlevel 1 echo WINGET_NOT_INSTALLED
          where powershell
          if errorlevel 1 echo WINDOWS_POWERSHELL_NOT_INSTALLED
          where wsl
          if errorlevel 1 echo WSL_NOT_INSTALLED
          exit /b 0
