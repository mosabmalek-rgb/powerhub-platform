name: Self-hosted Windows Runner Diagnostic

on:
  push:
    branches:
      - diagnostics/github-hosted-runner-20261014

permissions:
  contents: read

jobs:
  self-hosted-runner-check:
    name: Verify self-hosted runner default label
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Confirm local runner allocation and execution
        shell: cmd
        run: |
          echo SELF_HOSTED_RUNNER_DIAGNOSTIC_STARTED
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo RUNNER_NAME=%RUNNER_NAME%
          echo GITHUB_ACTIONS=%GITHUB_ACTIONS%
          if /I not "%RUNNER_OS%"=="Windows" exit /b 1
          if /I not "%RUNNER_ARCH%"=="X64" exit /b 1
          if /I not "%GITHUB_ACTIONS%"=="true" exit /b 1
          echo SELF_HOSTED_RUNNER_DIAGNOSTIC_PASSED
