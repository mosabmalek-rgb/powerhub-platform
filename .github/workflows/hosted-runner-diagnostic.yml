name: Self-hosted Windows Toolchain and PostgreSQL Readiness

on:
  push:
    branches:
      - diagnostics/github-hosted-runner-20261014

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect Windows CI prerequisites
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Runner identity
        shell: cmd
        run: |
          echo RUNNER_OS=%RUNNER_OS%
          echo RUNNER_ARCH=%RUNNER_ARCH%
          echo RUNNER_NAME=%RUNNER_NAME%
          whoami
          net session >nul 2>&1
          if errorlevel 1 (echo RUNNER_NOT_ELEVATED) else (echo RUNNER_ELEVATED)

      - name: Check toolchain
        shell: cmd
        run: |
          node --version
          call npm --version
          corepack --version
          git --version

      - name: Inspect PostgreSQL installations and isolated runtimes
        shell: cmd
        run: |
          where psql
          if errorlevel 1 echo PSQL_NOT_ON_PATH
          where pg_ctl
          if errorlevel 1 echo PG_CTL_NOT_ON_PATH
          where docker
          if errorlevel 1 echo DOCKER_NOT_ON_PATH
          where podman
          if errorlevel 1 echo PODMAN_NOT_ON_PATH
          where winget
          if errorlevel 1 echo WINGET_NOT_ON_PATH
          where wsl
          if errorlevel 1 echo WSL_NOT_ON_PATH
          wsl.exe --status
          wsl.exe --list --quiet
          if errorlevel 1 echo WSL_DISTRO_LIST_FAILED
          powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Service *postgres* -ErrorAction SilentlyContinue | Select-Object Name,Status,StartType | Format-Table -AutoSize; Get-ChildItem 'C:\Program Files\PostgreSQL' -ErrorAction SilentlyContinue | Select-Object FullName"
          exit /b 0
