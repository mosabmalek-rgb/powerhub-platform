name: Self-hosted Windows Runner Diagnostic

on:
  push:
    branches:
      - diagnostics/github-hosted-runner-20261014

permissions:
  contents: read

jobs:
  self-hosted-runner-check:
    name: Verify self-hosted runner default label
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Confirm local runner allocation and execution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Output "SELF_HOSTED_RUNNER_DIAGNOSTIC_STARTED"
          Write-Output "RUNNER_OS=$env:RUNNER_OS"
          Write-Output "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Output "RUNNER_NAME=$env:RUNNER_NAME"
          Write-Output "GITHUB_ACTIONS=$env:GITHUB_ACTIONS"
          if ($env:RUNNER_OS -ne "Windows") { throw "Expected Windows runner, got $env:RUNNER_OS" }
          if ($env:RUNNER_ARCH -ne "X64") { throw "Expected X64 runner, got $env:RUNNER_ARCH" }
          if ($env:GITHUB_ACTIONS -ne "true") { throw "GITHUB_ACTIONS was not true" }
          Write-Output "SELF_HOSTED_RUNNER_DIAGNOSTIC_PASSED"
