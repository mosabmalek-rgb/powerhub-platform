          psql --host 127.0.0.1 --port 5432 --username postgres --dbname financial_gl_atomic_accrual_test --set ON_ERROR_STOP=1 --file supabase/tests/financial_gl_atomic_accrual_posting.sql

      - name: Verify GL approval and reversal are exactly-once under independent PostgreSQL sessions
        env:
          PGHOST: 127.0.0.1
