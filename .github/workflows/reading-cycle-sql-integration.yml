name: Reading Cycle PostgreSQL Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/auth-local-first-single-pr]

permissions:
  contents: read

concurrency:
  group: reading-cycle-sql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Execute reading-cycle migration and assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d powerhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify release-tool ledger SQL round-trip on PostgreSQL 17
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: supabase_migration_ledger_payload_test
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres supabase_migration_ledger_payload_test
          node scripts/test-supabase-migration-ledger-payload.mjs

      - name: Verify release guard history, concurrent identities, and atomic rollback
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: supabase_migration_release_guard_test
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres supabase_migration_release_guard_test
          node scripts/test-supabase-migration-release-guard.mjs

      - name: Verify subscriber balance ledger credit/deposit source constraints
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres subscriber_balance_ledger_scope_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname subscriber_balance_ledger_scope_test --set ON_ERROR_STOP=1 --file supabase/tests/subscriber_balance_ledger_application_scope.sql

      - name: Verify tenant-scoped announcement unread counter and server-only ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres platform_announcement_tenant_scope_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname platform_announcement_tenant_scope_test --set ON_ERROR_STOP=1 --file supabase/tests/platform_announcement_tenant_role_scope.sql

      - name: Verify single-device field-app sessions
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres mobile_single_device_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname mobile_single_device_test --set ON_ERROR_STOP=1 --file supabase/tests/mobile_single_device_session.sql

      - name: Verify optional field-reader distribution, address grouping, balancing, and API ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres field_reading_distribution_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname field_reading_distribution_test --set ON_ERROR_STOP=1 --file supabase/tests/field_reading_distribution.sql

      - name: Execute migration against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname powerhub_test --set ON_ERROR_STOP=1 --file supabase/tests/reading_cycle_boundary_audit_fix.sql

      - name: Verify one non-rejected operational reading per configured cycle across all write paths
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres reading_cycle_duplicate_guard_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname reading_cycle_duplicate_guard_test --set ON_ERROR_STOP=1 --file supabase/tests/reading_cycle_duplicate_guard.sql
          PGDATABASE=reading_cycle_duplicate_guard_test bash supabase/tests/reading_cycle_duplicate_guard_concurrency.sh

      - name: Create isolated database for tariff history migration
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres powerhub_tariff_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname powerhub_tariff_test --set ON_ERROR_STOP=1 --file supabase/tests/tariff_price_history_migration.sql

      - name: Create isolated invoice-message database and test queue behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE invoice_sms_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_sms_test --set ON_ERROR_STOP=1 --file supabase/tests/invoice_bulk_sms_safety.sql

      - name: Verify invoice Delta snapshot, updates, tombstones, scope moves, and server-only ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres invoice_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/invoice_delta_sync_history.sql

      - name: Verify payment Delta snapshot, updates, tombstones, scope moves, and receipt secret filtering
