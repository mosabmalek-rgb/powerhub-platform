        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres financial_gl_two_session_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname financial_gl_two_session_test --set ON_ERROR_STOP=1 --file supabase/tests/financial_gl_two_session_setup.sql
          bash supabase/tests/financial_gl_two_session_concurrency.sh

      - name: Verify independent financial-settlement approval and immutable approver identity
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres financial_settlement_approval_controls_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname financial_settlement_approval_controls_test --set ON_ERROR_STOP=1 --file supabase/tests/financial_settlement_approval_controls.sql

      - name: Verify ledger-derived financial settlement, cash reconciliation, and supplier disclosures
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres financial_settlement_ledger_derived_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname financial_settlement_ledger_derived_test --set ON_ERROR_STOP=1 --file supabase/tests/financial_settlement_ledger_derived.sql

      - name: Reproduce financial source write racing settlement lock in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
          PGDATABASE: financial_settlement_concurrency_reproduction_test
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres financial_settlement_concurrency_reproduction_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname financial_settlement_concurrency_reproduction_test --set ON_ERROR_STOP=1 --file supabase/tests/financial_settlement_concurrency_setup.sql
