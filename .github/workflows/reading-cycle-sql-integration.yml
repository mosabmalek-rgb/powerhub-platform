        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres company_account_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname company_account_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/company_account_delta_sync_history.sql

      - name: Verify site-bound read guards across tenant branch data
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres site_bound_read_scope_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname site_bound_read_scope_test --set ON_ERROR_STOP=1 --file supabase/tests/site_bound_read_scope.sql

      - name: Verify manual company-account movement and transfer idempotency
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres company_account_movement_idempotency_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname company_account_movement_idempotency_test --set ON_ERROR_STOP=1 --file supabase/tests/company_account_movement_idempotency.sql

      - name: Verify A2 general-ledger foundation migration and negative cases in isolated PostgreSQL
        env:
