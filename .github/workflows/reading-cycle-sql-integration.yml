        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE invoice_issued_automation_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_issued_automation_test --set ON_ERROR_STOP=1 --file supabase/tests/unified_invoice_issued_automation.sql

