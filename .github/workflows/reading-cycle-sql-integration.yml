          psql --host 127.0.0.1 --port 5432 --username postgres --dbname payment_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/payment_delta_sync_history.sql

      - name: Verify expense Delta snapshots, tombstones, scope moves, and ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres expense_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname expense_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/expense_delta_sync_history.sql

      - name: Verify offline expense Outbox idempotency and server-only RPC grants
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_expense_idempotency_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_expense_idempotency_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_expense_idempotency.sql

      - name: Verify company-account Delta ledger, branch links, tombstones, and ACLs
        env:
