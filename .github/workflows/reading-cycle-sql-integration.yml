name: Reading Cycle PostgreSQL Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: reading-cycle-sql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-integration:
    name: Execute reading-cycle migration and assertions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: powerhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d powerhub_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify single-device field-app sessions
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres mobile_single_device_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname mobile_single_device_test --set ON_ERROR_STOP=1 --file supabase/tests/mobile_single_device_session.sql

      - name: Execute migration against disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname powerhub_test --set ON_ERROR_STOP=1 --file supabase/tests/reading_cycle_boundary_audit_fix.sql

      - name: Create isolated database for tariff history migration
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres powerhub_tariff_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname powerhub_tariff_test --set ON_ERROR_STOP=1 --file supabase/tests/tariff_price_history_migration.sql

      - name: Create isolated invoice-message database and test queue behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE invoice_sms_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_sms_test --set ON_ERROR_STOP=1 --file supabase/tests/invoice_bulk_sms_safety.sql

      - name: Verify invoice Delta snapshot, updates, tombstones, scope moves, and server-only ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres invoice_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/invoice_delta_sync_history.sql

      - name: Verify payment Delta snapshot, updates, tombstones, scope moves, and receipt secret filtering
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres payment_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname payment_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/payment_delta_sync_history.sql

      - name: Verify expense Delta snapshots, tombstones, scope moves, and ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres expense_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname expense_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/expense_delta_sync_history.sql

      - name: Verify company-account Delta ledger, branch links, tombstones, and ACLs
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres company_account_delta_sync_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname company_account_delta_sync_test --set ON_ERROR_STOP=1 --file supabase/tests/company_account_delta_sync_history.sql

      - name: Verify unified invoice-issued automation, amount formatting, and deduplication
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE invoice_issued_automation_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname invoice_issued_automation_test --set ON_ERROR_STOP=1 --file supabase/tests/unified_invoice_issued_automation.sql

      - name: Verify unified messaging automation lifecycle RPC
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres messaging_automation_state_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname messaging_automation_state_test --set ON_ERROR_STOP=1 --file supabase/tests/unified_messaging_automation_state.sql

      - name: Verify dashboard financial aggregate read models
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE dashboard_financial_aggregate_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname dashboard_financial_aggregate_test --set ON_ERROR_STOP=1 --file supabase/tests/dashboard_financial_aggregate_read_models.sql

      - name: Create isolated all-branch dashboard KPI database
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname postgres --set ON_ERROR_STOP=1 --command "CREATE DATABASE dashboard_kpi_test"
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname dashboard_kpi_test --set ON_ERROR_STOP=1 --file supabase/tests/dashboard_all_branch_kpis.sql

      - name: Test unified message history filters and tenant/site isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres message_history_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname message_history_test --set ON_ERROR_STOP=1 --file supabase/tests/unified_message_history_filters.sql

      - name: Create isolated site-billing policy database and assert financial invariants
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres site_billing_policy_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname site_billing_policy_test --set ON_ERROR_STOP=1 --file supabase/tests/site_billing_policy_integration.sql

      - name: Verify payment idempotency under concurrent retries
        env:
          PGPASSWORD: postgres
          PGDATABASE: site_billing_policy_test
        run: bash supabase/tests/payment_idempotency_concurrency.sh

      - name: Reconcile server-only platform security table ACLs and RLS
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres platform_security_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname platform_security_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/platform_security_table_acl_reconciliation.sql

      - name: Verify payment-documentation admin and owner precedence
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres payment_documentation_precedence_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname payment_documentation_precedence_test --set ON_ERROR_STOP=1 --file supabase/tests/payment_documentation_admin_owner_precedence.sql

      - name: Verify payment-documentation invoice lines and fast pending-status path
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres payment_documentation_context_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname payment_documentation_context_test --set ON_ERROR_STOP=1 --file supabase/tests/payment_documentation_context_lines_fast_read.sql

      - name: Verify SMS wallet admin operations in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres sms_wallet_admin_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname sms_wallet_admin_test --set ON_ERROR_STOP=1 --file supabase/tests/sms_wallet_admin_operations.sql

      - name: Verify inventory and supplier ledger foundation in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_supplier_foundation_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_supplier_foundation_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_supplier_foundation.sql

      - name: Verify inventory purchasing, measured fuel, idempotency, audit rollback, and tenant isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_purchase_receiving_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_purchase_receiving_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_purchase_receiving_workflow.sql
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_purchase_receiving_test --set ON_ERROR_STOP=1 --file supabase/migrations/20261022090000_powerhub_inventory_foreign_key_indexes.sql
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_purchase_receiving_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_foreign_key_indexes.sql

      - name: Verify core financial tables reject direct client mutations
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_core_dml_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_core_dml_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_core_direct_dml_acl.sql

      - name: Verify offline sync core writes remain server-only
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_core_write_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_core_write_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_core_write_acl_hardening.sql

      - name: Verify staging schema and RPC reconciliation is idempotent and server-only
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres staging_schema_reconciliation_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname staging_schema_reconciliation_test --set ON_ERROR_STOP=1 --file supabase/tests/staging_schema_object_reconciliation.sql

      - name: Verify quota alert table access remains server-only
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_quota_alert_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_quota_alert_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_quota_alert_acl_hardening.sql

      - name: Verify legacy subscriber SECURITY DEFINER RPCs are server-only and repeatable
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres legacy_subscriber_rpc_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname legacy_subscriber_rpc_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/legacy_subscriber_rpc_acl_hardening.sql

      - name: Verify notification trigger functions are not browser-callable
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_notification_trigger_acl_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_notification_trigger_acl_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_notification_trigger_acl_hardening.sql

      - name: Verify offline device-lock schema reconciliation and single-device behavior
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_device_lock_reconcile_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_device_lock_reconcile_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_device_lock_schema_reconciliation.sql

      - name: Verify offline generator RPCs reject expired owner memberships
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_generator_membership_expiry_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_generator_membership_expiry_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_generator_membership_expiry.sql

      - name: Verify membership expiry and core-table RLS scope alignment
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_rls_scope_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_rls_scope_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_rls_scope_alignment.sql

      - name: Verify generator and meter-reading hot-path index parity
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_reading_indexes_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_reading_indexes_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_generator_reading_index_reconciliation.sql

      - name: Verify financial indexes and company-account updated-at trigger
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres inventory_financial_index_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname inventory_financial_index_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_financial_index_reconciliation.sql

      - name: Verify concurrent inventory issues, idempotency, and ledger reconciliation
        env:
          PGPASSWORD: postgres
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGDATABASE: inventory_purchase_receiving_test
        run: bash supabase/tests/inventory_concurrency_and_reconciliation.sh

      - name: Verify per-user fine-grained permissions in isolated PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres staff_inventory_permissions_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname staff_inventory_permissions_test --set ON_ERROR_STOP=1 --file supabase/tests/staff_inventory_permissions.sql

      - name: Verify Phase C maintenance, stock integration, idempotency, costing, and access control
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres maintenance_phase_c_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname maintenance_phase_c_test --set ON_ERROR_STOP=1 --file supabase/tests/inventory_maintenance_phase_c.sql

      - name: Verify employee advances, loan installments, repayment idempotency, accounting, and tenant isolation
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres employee_advances_loans_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname employee_advances_loans_test --set ON_ERROR_STOP=1 --file supabase/tests/employee_advances_loans_integration.sql

      - name: Verify offline number range migration, reservation idempotency, claims, RLS, and allocator continuity
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres offline_number_range_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname offline_number_range_test --set ON_ERROR_STOP=1 --file supabase/tests/offline_number_range_migration_integration.sql

      - name: Verify employee advances migration with the pre-existing production payroll-allocation table
        env:
          PGPASSWORD: postgres
        run: |
          createdb --host 127.0.0.1 --port 5432 --username postgres employee_advances_prod_compatibility_test
          psql --host 127.0.0.1 --port 5432 --username postgres --dbname employee_advances_prod_compatibility_test --set ON_ERROR_STOP=1 --set PREEXIST_PAYROLL_ALLOCATIONS=1 --file supabase/tests/employee_advances_loans_integration.sql
