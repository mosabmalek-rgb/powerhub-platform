name: one-off-fix-complaints
on:
  push:
    branches:
      - tmp/fix-complaints-20260913
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch complaints hook
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('client/src/pages/AdminAdvancedWorkspace.tsx')
          s = p.read_text()
          old = 'const complaints = trpc.admin.listComplaints.useQuery();'
          new = 'const complaints = trpc.admin.listComplaints.useQuery(undefined);'
          if old not in s:
              raise SystemExit('target string not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/src/pages/AdminAdvancedWorkspace.tsx
          git commit -m 'fix(admin-ui): pass undefined to optional complaints query'
          git push
